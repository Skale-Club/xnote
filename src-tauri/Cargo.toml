[package]
name = "xnote"
version = "0.1.0"
description = "Xnote: AI meeting notes with local transcription"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
minisign-verify = "0.2"
base64 = "0.22"
cpal = "0.15"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
