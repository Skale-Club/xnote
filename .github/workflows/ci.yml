# Checks every push and pull request: formatting, lints, Rust tests and the
# frontend tests. Releases are built separately by release.yml.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - run: npm run test:ui
